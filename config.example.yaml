# AI Assistant Configuration
#
# All modules are loaded; the backend keys control their behavior.
# See docs/contracts/schemas.md for the full key reference.

bus:
  # Loopback by default. Widening this REQUIRES a non-empty remote_auth_token,
  # or the assistant refuses to start: an unauthenticated reachable bus lets
  # anyone publish input to the agent. See docs/security/threat-model.md
  # RISK-0001.
  bind: "127.0.0.1"
  websocket_port: 8765
  remote_auth_token: ""

agent:
  # The loop owner: native (our loop). The interface is open, so another
  # harness could be added. See ADR-0004.
  harness: native
  persona: |
    You are Jarvis, a conversational voice assistant. Speak the way a person talks: natural, warm, and direct. Keep every reply to one short paragraph. Never use more than five sentences, even if the user asks for more detail; offer to continue instead of writing more. Never use emoji, markdown, headings, or bullet lists. Do not read code, URLs, or file paths aloud. Match the user's language. When a tool is needed, use it and answer with the result in your own words. If a request is unclear, ask one short question instead of guessing.
  llm:
    provider: ollama
    model: qwen3:latest
    url: http://127.0.0.1:11434
    api_key: ""
    max_tokens: 4096
    temperature: 0.7
  memory:
    conversations_path: ".config/aiassistant/memory/conversations"
    facts_path: ".config/aiassistant/memory/facts"
    knowledge_path: ".config/aiassistant/memory/knowledge"
    embeddings_db: ".config/aiassistant/embeddings.db"
    context_max_tokens: 4096
    context_recent_messages: 20
  embeddings:
    provider: ollama
    model: qwen3-embedding:0.6b
    url: ""
    batch_size: 10
  thinking:
    max_reflect_loops: 3

conversation:
  # What happens when input arrives during a turn: "interrupt" supersedes the
  # in-flight turn, "queue" would wait for it.
  busy: interrupt
  turn_timeout_s: 300
  retry_max: 3

scheduler:
  storage_path: ".config/aiassistant/schedules.json"
  max_pending: 100

voice:
  listen:
    # ptt (push-to-talk) | open (always listening) | wake (wake phrase gates)
    mode: open
  hotwords: ["hey jarvis"]
  endpoint_silence_ms: 2000
  # Wake mode only: after the wake phrase, follow-up utterances are accepted
  # without repeating it, until this much quiet time passes.
  wake_window_ms: 8000
  # After the assistant finishes speaking, keep the mic gated this long so the
  # speaker's tail is not heard and transcribed as a new turn (echo guard).
  echo_guard_ms: 400
  speak_text_turns: false
  barge_in:
    # Voice barge-in needs echo cancellation. Without it the assistant hears
    # itself and self-triggers. See docs/architecture/decisions/ADR-0011.
    enabled: false
  vad:
    # energy (default, numpy only) | webrtc (needs the `vad` extra)
    backend: energy
    energy_threshold: 0.02
    aggressiveness: 3
  segmenter:
    # Pre-roll keeps a word onset from being clipped; min rejects an energy
    # spike; max force-emits so a stuck VAD cannot grow memory without bound;
    # onset requires speech to persist before a segment opens (noise rejection).
    preroll_ms: 200
    min_utterance_ms: 100
    max_utterance_ms: 30000
    onset_ms: 100
  asr:
    # Presets set this block (and tts below); per-stage keys are the only truth.
    #   --audio:    asr.backend=whisper_server, tts.backend=edge_tts
    #   --offline:  asr.backend=faster_whisper, tts.backend=text
    # Backends, none of which needs a paid service:
    #   faster_whisper  offline, runs locally (default); needs the `asr-offline`
    #                   extra; the model downloads once on first use
    #   whisper_server  your own self-hosted Whisper HTTP server (keyless);
    #                   set base_url, for example http://127.0.0.1:8080/v1
    #   whisper | funasr | stub
    # An unknown value fails voice setup, it does not fall back.
    backend: faster_whisper
    model: base
    # faster_whisper only. "auto" can pick CUDA and then fail without the CUDA
    # runtime libs; cpu is the safe default, cuda is opt-in.
    device: cpu
    compute_type: int8
    # whisper_server only: the endpoint. There is no hosted default.
    base_url: ""
    # Optional. A self-hosted server ignores the key, so it is normally blank.
    # `api_key_env` names an environment variable to fall back to.
    api_key: ""
    api_key_env: "ASR_API_KEY"
    language: ""
  tts:
    # Backends: edge_tts (online) | text (offline, prints the text).
    backend: edge_tts
    voice: "en-US-AriaNeural"
    speed: 1.0

vision:
  backend: stub
  camera_index: 0
  vision_model: null
  vision_model_url: ""

tools:
  # Discovered by importing each package and scanning it, so it works from
  # source, an installed package, or a frozen build.
  packages:
    - "aiassistant.tools.builtin_tools"
    - "aiassistant.tools.skills"
  sandbox_default: false
  command_timeout: 30
  safe_paths: ["./workspace", "/tmp/aiassistant"]

console:
  backend: simple
  prompt: "> "

messaging:
  backends: []
  telegram_token: ""
  telegram_allowed_users: []

display:
  # The visual shell: gui | tui | none | auto. Text (the console) and audio are
  # always available; this only selects the extra visual layer (ADR-0017).
  #   auto  — gui when a display server is available, none otherwise (default)
  #   gui   — the PySide6 orb window
  #   tui   — the terminal orb (needs an interactive terminal)
  #   none  — text only, no visual shell
  # Legacy values are accepted: orb -> gui, console -> none.
  # AIASSISTANT_DISPLAY_OFF=1 forces none without touching this file.
  mode: auto
  always_on_top: true
  # Wayland cannot reliably keep a client on top or accept client positioning;
  # the orb degrades to a normal window there.
  reduced_motion: false
