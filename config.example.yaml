# AI Assistant Configuration
#
# All modules are loaded; the backend keys control their behavior.
# See docs/contracts/schemas.md for the full key reference.

bus:
  # Loopback by default. Widening this REQUIRES a non-empty remote_auth_token,
  # or the assistant refuses to start: an unauthenticated reachable bus plus a
  # pi harness is a remote shell. See docs/security/threat-model.md RISK-0001.
  bind: "127.0.0.1"
  websocket_port: 8765
  remote_auth_token: ""

agent:
  # The loop owner: native (our loop) or pi (external agent). See
  # docs/architecture/decisions/ADR-0004-harness-vs-provider.md
  harness: native
  persona: |
    You are a smart, detail-oriented assistant. Always think step by step.
    Match the user's language. Be concise. Use tools when available.
  llm:
    provider: ollama
    model: qwen3:latest
    url: http://127.0.0.1:11434
    api_key: ""
    max_tokens: 4096
    temperature: 0.7
  pi:
    # pi is a coding agent, not a model provider. It is disabled by default
    # because it runs with your permissions and has no permission system of its
    # own. Read docs/security/threat-model.md before enabling it.
    enabled: false
    command: "pi"
    # Runtime data under HOME, so the workspace never moves with the directory
    # the assistant is launched from (ADR-0016).
    workspace: "~/.config/aiassistant/pi_workspace"
    tools: [read, write, edit, grep, find, ls]
    # "builtin" loads the shipped workspace_guard.ts from the package. Any
    # other value is a path (absolute recommended; ~ is expanded). A path that
    # does not exist fails startup rather than silently disabling the guard.
    # null disables the guard (confined tools become unconfined).
    policy_extension: "builtin"
    allow_channels: [console, voice, orb, tui]
    turn_timeout_s: 300
    restart_backoff_s: [1, 2, 4, 8, 30]
    memory_prime_on_start: true
  memory:
    conversations_path: ".config/aiassistant/memory/conversations"
    facts_path: ".config/aiassistant/memory/facts"
    knowledge_path: ".config/aiassistant/memory/knowledge"
    embeddings_db: ".config/aiassistant/embeddings.db"
    context_max_tokens: 4096
    context_recent_messages: 20
  embeddings:
    provider: ollama
    model: qwen3-embedding:0.6b
    url: ""
    batch_size: 10
  thinking:
    max_reflect_loops: 3

conversation:
  # What happens when input arrives during a turn: "interrupt" supersedes the
  # in-flight turn, "queue" would wait for it.
  busy: interrupt
  turn_timeout_s: 300
  retry_max: 3

scheduler:
  storage_path: ".config/aiassistant/schedules.json"
  max_pending: 100

voice:
  listen:
    # ptt (push-to-talk) | open (always listening) | wake (wake phrase gates)
    mode: open
  backend: stub
  recognizer: whisper          # whisper | funasr (only used with backend: halasr)
  hotwords: ["hey jarvis"]
  endpoint_silence_ms: 2000
  speak_text_turns: false
  barge_in:
    # Voice barge-in needs echo cancellation. Without it the assistant hears
    # itself and self-triggers. See docs/architecture/decisions/ADR-0011.
    enabled: false

voice_tts:
  backend: text
  voice: "en-US-AriaNeural"
  speed: 1.0

vision:
  backend: stub
  camera_index: 0
  vision_model: null
  vision_model_url: ""

tools:
  # Discovered by importing each package and scanning it, so it works from
  # source, an installed package, or a frozen build.
  packages:
    - "aiassistant.tools.builtin_tools"
    - "aiassistant.tools.skills"
  sandbox_default: false
  command_timeout: 30
  safe_paths: ["./workspace", "/tmp/aiassistant"]

console:
  backend: simple
  prompt: "> "

messaging:
  backends: []
  telegram_token: ""
  telegram_allowed_users: []

display:
  # The visual shell: gui | tui | none | auto. Text (the console) and audio are
  # always available; this only selects the extra visual layer (ADR-0017).
  #   auto  — gui when a display server is available, none otherwise (default)
  #   gui   — the PySide6 orb window
  #   tui   — the terminal orb (needs an interactive terminal)
  #   none  — text only, no visual shell
  # Legacy values are accepted: orb -> gui, console -> none.
  # AIASSISTANT_DISPLAY_OFF=1 forces none without touching this file.
  mode: auto
  always_on_top: true
  # Wayland cannot reliably keep a client on top or accept client positioning;
  # the orb degrades to a normal window there.
  reduced_motion: false
